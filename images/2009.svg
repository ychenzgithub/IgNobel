<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2009" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="xrayGlow2009" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2009)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">2009 医学奖：连续60年只掰左手关节的自体对照实验</text>

  <!-- 60-Year Calendar Badge -->
  <rect x="30" y="72" width="145" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <rect x="30" y="72" width="145" height="26" rx="8" fill="#dc2626"/>
  <text x="102" y="90" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">实验周期：60+ 年</text>
  <text x="102" y="116" text-anchor="middle" fill="#78350f" font-family="monospace" font-size="15" font-weight="bold">1948 → 2009</text>
  <text x="102" y="136" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="11">累计掰响 &gt; 36,500 次</text>
  <text x="102" y="154" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold">样本量 n = 1（本人）</text>

  <!-- Center X-Ray Screen -->
  <rect x="195" y="70" width="250" height="215" rx="14" fill="#090d16" stroke="#64748b" stroke-width="4"/>
  <circle cx="320" cy="175" r="105" fill="url(#xrayGlow2009)"/>
  <text x="320" y="94" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="bold">X-RAY ARTHRITIS SCAN</text>
  <line x1="320" y1="104" x2="320" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Left Hand on X-Ray (Cracked every day) -->
  <g transform="translate(215, 112)">
    <text x="48" y="14" text-anchor="middle" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="bold">左手 (实验组)</text>
    <!-- Palm & Finger Bones -->
    <rect x="33" y="82" width="30" height="35" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="25" y1="80" x2="18" y2="42" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="78" x2="36" y2="30" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="78" x2="52" y2="28" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="62" y1="80" x2="68" y2="38" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="92" x2="86" y2="68" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <!-- Sound waves & Crack sparks -->
    <circle cx="36" cy="54" r="5" fill="#facc15"/>
    <circle cx="51" cy="52" r="5" fill="#facc15"/>
    <path d="M8,36 L18,44 M6,52 L16,54 M75,28 L66,38" stroke="#facc15" stroke-width="2.5"/>
    <text x="48" y="136" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="bold">咔啪！每天2次</text>
    <text x="48" y="154" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">关节炎：0 处</text>
  </g>

  <!-- Right Hand on X-Ray (Control Group) -->
  <g transform="translate(330, 112)">
    <text x="48" y="14" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold">右手 (对照组)</text>
    <!-- Palm & Finger Bones -->
    <rect x="33" y="82" width="30" height="35" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="26" y1="92" x2="10" y2="68" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="34" y1="80" x2="28" y2="38" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="46" y1="78" x2="44" y2="28" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="58" y1="78" x2="60" y2="30" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="80" x2="78" y2="42" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
    <text x="48" y="136" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">60年从不掰响</text>
    <text x="48" y="154" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">关节炎：0 处</text>
  </g>

  <!-- Dr. Donald Unger on Right -->
  <g transform="translate(465, 95)">
    <!-- Lab Coat -->
    <path d="M35,95 L115,95 L128,195 L22,195 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M62,95 L75,135 L88,95" fill="#1e293b"/>
    <path d="M72,102 L78,102 L80,130 L70,130 Z" fill="#dc2626"/>
    <!-- Head & Glasses -->
    <circle cx="75" cy="58" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <path d="M48,48 Q50,24 75,26 Q100,24 102,48" fill="#e2e8f0"/>
    <circle cx="64" cy="56" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="86" cy="56" r="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="72" y1="56" x2="78" y2="56" stroke="#1e293b" stroke-width="2"/>
    <circle cx="64" cy="56" r="3" fill="#0f172a"/>
    <circle cx="86" cy="56" r="3" fill="#0f172a"/>
    <path d="M63,72 Q75,82 87,72" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Speech Bubble -->
  <rect x="30" y="300" width="580" height="62" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
  <text x="320" y="325" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">唐纳德·昂格尔医生仰天长啸：“老妈！你当年说掰手指会得关节炎，纯粹是吓唬我！”</text>
  <text x="320" y="348" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="12">结论：气穴爆裂声虽响，但左手与右手骨骼同样健康，母爱唠叨假说被彻底证伪</text>
</svg>