<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2018" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#sky2018)"/>
  <!-- Red Rock Canyon Background (Big Thunder Mountain style) -->
  <polygon points="0,330 90,140 190,330" fill="#c2410c"/>
  <polygon points="140,330 250,115 370,330" fill="#9a3412"/>
  <polygon points="430,330 530,150 640,330" fill="#c2410c"/>
  <!-- Roller Coaster Wooden Trestles -->
  <g stroke="#78350f" stroke-width="3" opacity="0.6">
    <line x1="80" y1="150" x2="80" y2="330"/>
    <line x1="160" y1="185" x2="160" y2="330"/>
    <line x1="260" y1="220" x2="260" y2="330"/>
    <line x1="380" y1="240" x2="380" y2="330"/>
    <line x1="500" y1="210" x2="500" y2="330"/>
  </g>
  <!-- Roller Coaster Track -->
  <path d="M 10 110 Q 140 140 270 220 Q 410 295 620 175" fill="none" stroke="#f8fafc" stroke-width="8"/>
  <path d="M 10 118 Q 140 148 270 228 Q 410 303 620 183" fill="none" stroke="#475569" stroke-width="5"/>
  <!-- Rear Car (HIGH PASSAGE RATE 63.89%!) -->
  <g transform="translate(155, 148) rotate(26)">
    <rect x="-55" y="-32" width="115" height="42" rx="10" fill="#ef4444" stroke="#facc15" stroke-width="3"/>
    <circle cx="-35" cy="14" r="9" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="35" cy="14" r="9" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Doctor 1 cheering -->
    <circle cx="-25" cy="-48" r="14" fill="#fed7aa"/>
    <line x1="-35" y1="-35" x2="-48" y2="-65" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="-35" x2="-2" y2="-65" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-29" cy="-50" r="2" fill="#0f172a"/>
    <circle cx="-21" cy="-50" r="2" fill="#0f172a"/>
    <path d="M -29 -43 Q -25 -38 -21 -43" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- 3D Printed Kidney Model in Clear Case -->
    <rect x="2" y="-68" width="46" height="44" rx="8" fill="#e0f2fe" opacity="0.9" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Kidney bean shape -->
    <path d="M 16 -58 C 8 -58 8 -34 18 -34 C 24 -34 24 -42 28 -44 C 32 -42 32 -34 38 -36 C 44 -42 40 -58 26 -58 Z" fill="#f43f5e" stroke="#881337" stroke-width="1.5"/>
    <!-- Flying Kidney Stones popping out! -->
    <circle cx="25" cy="-78" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="38" cy="-86" r="4.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="12" cy="-88" r="4" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 25 -55 L 25 -72 M 30 -55 L 36 -80 M 20 -55 L 14 -82" stroke="#fde047" stroke-width="2" stroke-dasharray="3,2"/>
  </g>
  <!-- Callout for Rear Car -->
  <rect x="28" y="32" width="235" height="62" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
  <text x="145" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">🎢 过山车车尾 (黄金排石座)</text>
  <text x="145" y="78" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="13" font-weight="bold">排石成功率：63.89%！咻咻飞出！</text>
  <!-- Front Car (LOW PASSAGE RATE 16.67%) -->
  <g transform="translate(425, 222) rotate(-8)">
    <polygon points="-50,-28 55,-28 70,10 -50,10" fill="#64748b" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="25" y="-45" width="22" height="18" fill="#334155"/>
    <circle cx="-25" cy="14" r="9" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="35" cy="14" r="9" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="-10" cy="-42" r="13" fill="#fed7aa"/>
  </g>
  <rect x="375" y="105" width="225" height="54" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="487" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">🚂 过山车车头 (温和摇晃座)</text>
  <text x="487" y="148" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">排石成功率仅：16.67%</text>
  <!-- Bottom Banner -->
  <rect x="20" y="322" width="600" height="42" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="320" y="348" text-anchor="middle" fill="#fef9c3" font-family="sans-serif" font-size="13" font-weight="bold">2018 医学奖：带着3D打印仿真肾脏连坐20趟迪士尼过山车排肾结石</text>
</svg>