<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg99" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tea99" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg99)" rx="16"/>
  <!-- Blueprint Grid Lines -->
  <g stroke="#8b5cf6" stroke-width="0.7" opacity="0.25">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/><line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/><line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/><line x1="600" y1="0" x2="600" y2="380"/>
  </g>
  <!-- Lab Table -->
  <rect x="0" y="295" width="640" height="85" fill="#2e1065"/>
  <line x1="0" y1="295" x2="640" y2="295" stroke="#c084fc" stroke-width="3"/>

  <!-- Left: Non-Dripping Teapot pouring tea -->
  <g transform="translate(115, 135)">
    <!-- Handle -->
    <path d="M-55 -15 C-88 -15, -88 45, -55 45" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <!-- Pot Body -->
    <ellipse cx="0" cy="18" rx="60" ry="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M-45 0 Q0 15 45 0" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-28" rx="28" ry="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="-38" r="7" fill="#f59e0b"/>
    <!-- Hydrophobic Curved Spout -->
    <path d="M52 8 C78 0, 92 -22, 112 -18 C98 -2, 85 22, 54 28 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Laminar Tea Stream -->
    <path d="M112 -16 Q142 15 152 88" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
    <rect x="-58" y="75" width="135" height="26" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="10" y="92" font-family="sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">零滴漏茶壶嘴 (v ≥ v_c)</text>
  </g>

  <!-- Center: Giant Teacup & Precision Biscuit Dunking -->
  <g transform="translate(320, 235)">
    <!-- Saucer -->
    <ellipse cx="0" cy="58" rx="105" ry="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Cup Handle -->
    <path d="M75 -15 C112 -15, 112 38, 72 38" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <!-- Cup Body -->
    <path d="M-82 -35 L82 -35 C78 35, 52 55, 0 55 C-52 55, -78 35, -82 -35 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Tea Surface -->
    <ellipse cx="0" cy="-35" rx="78" ry="14" fill="url(#tea99)"/>
    <!-- Protractor Arc Measuring Dunking Angle -->
    <path d="M-65 -35 A65 65 0 0 1 0 -100" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="-52" y="-82" font-family="monospace" font-size="13" font-weight="bold" fill="#fde047">θ = 45°最佳倾角</text>
    <!-- The Biscuit being dunked at 45 degrees -->
    <g transform="translate(12, -55) rotate(-35)">
      <rect x="-24" y="-55" width="48" height="86" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
      <!-- Wet soggy bottom part -->
      <rect x="-24" y="5" width="48" height="26" rx="6" fill="#92400e"/>
      <circle cx="-10" cy="-35" r="2.5" fill="#78350f"/>
      <circle cx="10" cy="-35" r="2.5" fill="#78350f"/>
      <circle cx="0" cy="-18" r="2.5" fill="#78350f"/>
      <circle cx="-10" cy="-2" r="2.5" fill="#78350f"/>
      <circle cx="10" cy="-2" r="2.5" fill="#78350f"/>
    </g>
    <!-- Mechanical Clamp holding biscuit -->
    <path d="M35 -108 L52 -135 M45 -100 L62 -127" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Formula Blackboard on Top Right -->
  <rect x="435" y="42" width="182" height="145" rx="10" fill="#064e3b" stroke="#fbbf24" stroke-width="3"/>
  <text x="526" y="68" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde68a" text-anchor="middle">Washburn 浸饼干方程</text>
  <text x="526" y="102" font-family="serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">L² = (γ · D · t) / 4η</text>
  <line x1="452" y1="116" x2="600" y2="116" stroke="#34d399" stroke-width="1"/>
  <text x="526" y="138" font-family="sans-serif" font-size="11.5" fill="#a7f3d0" text-anchor="middle">最佳浸泡时间 t = 3.5 秒</text>
  <text x="526" y="158" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">超过5秒 → 饼干断落杯底惨剧！</text>
  <text x="526" y="176" font-family="monospace" font-size="10.5" fill="#fde047" text-anchor="middle">+ 英国标准 BS-6008 认证</text>

  <!-- BS-6008 Manual Book on Right Table -->
  <g transform="translate(475, 250)">
    <rect x="0" y="0" width="120" height="38" rx="4" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
    <text x="60" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">BS-6008 国家标准</text>
    <text x="60" y="31" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">《泡茶的唯一正确规范》</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="24" y="336" width="592" height="32" rx="8" fill="#fbbf24"/>
  <text x="320" y="357" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">1999 物理学与文学奖 · 浸饼干最优公式、不滴水茶壶嘴与英国国家泡茶标准</text>
</svg>