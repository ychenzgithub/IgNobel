<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2011" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="wasabiCloud2011" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#65a30d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2011)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#365314" stroke="#a3e635" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" fill="#ecfccb" font-family="sans-serif" font-size="16" font-weight="bold">2011 Chemistry Prize: The Airborne Wasabi Emergency Fire Alarm</text>

  <!-- Fire/Smoke Alert on Left Wall -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="145" height="95" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="72" y="25" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold">🔥 FIRE EMERGENCY!</text>
    <text x="72" y="48" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="10">Bells fail for deaf sleepers</text>
    <text x="72" y="68" text-anchor="middle" fill="#a3e635" font-family="sans-serif" font-size="11" font-weight="bold">Deploy: Wasabi Mist</text>
    <text x="72" y="85" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">(Allyl Isothiocyanate)</text>
  </g>

  <!-- Ceiling Wasabi Alarm Device -->
  <g transform="translate(230, 62)">
    <rect x="25" y="0" width="90" height="28" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <circle cx="45" cy="14" r="5" fill="#ef4444"/>
    <!-- Wasabi Tube attached -->
    <path d="M55,28 L85,28 L78,56 L62,56 Z" fill="#84cc16" stroke="#365314" stroke-width="2"/>
    <text x="70" y="18" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">WASABI</text>
    <!-- Green Pungent Wasabi Mist Cone -->
    <polygon points="70,56 -20,220 195,220" fill="url(#wasabiCloud2011)"/>
    <circle cx="65" cy="115" r="28" fill="#84cc16" opacity="0.45"/>
    <circle cx="95" cy="150" r="35" fill="#a3e635" opacity="0.45"/>
    <circle cx="40" cy="160" r="30" fill="#bef264" opacity="0.4"/>
    <text x="75" y="135" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">PSSSHHH——!!</text>
    <text x="75" y="158" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold">Pungent Horseradish Aerosol</text>
  </g>

  <!-- Bed & Awakened Sleeper Bolting Upright -->
  <g transform="translate(155, 215)">
    <!-- Bed Frame & Mattress -->
    <rect x="0" y="95" width="320" height="32" rx="6" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="10" y="72" width="300" height="26" rx="8" fill="#bae6fd"/>
    <ellipse cx="55" cy="68" rx="32" ry="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Blanket -->
    <path d="M115,72 Q200,55 295,72 L295,98 L115,98 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Person Bolting Upright in Shock -->
    <rect x="75" y="25" width="42" height="50" rx="8" fill="#f43f5e"/>
    <circle cx="96" cy="0" r="24" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5"/>
    <!-- Wide Awake Bulging Eyes & Spicy Tears -->
    <circle cx="88" cy="-4" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="106" cy="-4" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="88" cy="-4" r="2.5" fill="#000000"/>
    <circle cx="106" cy="-4" r="2.5" fill="#000000"/>
    <!-- Tears flying out -->
    <circle cx="74" cy="2" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="2" r="4" fill="#38bdf8"/>
    <!-- Screaming Nose & Mouth -->
    <circle cx="97" cy="4" r="4.5" fill="#ef4444"/>
    <ellipse cx="97" cy="14" rx="9" ry="6" fill="#7f1d1d"/>
    <!-- Shock Bolts -->
    <path d="M65,-25 L75,-15 M96,-35 L96,-22 M125,-25 L115,-15" stroke="#facc15" stroke-width="3"/>
    <!-- Speech Bubble -->
    <rect x="140" y="-32" width="215" height="52" rx="10" fill="#ffffff" stroke="#84cc16" stroke-width="3"/>
    <text x="247" y="-10" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">&quot;MY NOSE!! SO SPICY! I'M AWAKE!&quot;</text>
    <text x="247" y="10" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="11">Wakes sleepers within 10 seconds!</text>
  </g>

  <!-- Right Panel: Lab Data -->
  <rect x="445" y="75" width="170" height="105" rx="10" fill="#ecfccb" stroke="#65a30d" stroke-width="2.5"/>
  <text x="530" y="98" text-anchor="middle" fill="#365314" font-family="sans-serif" font-size="12" font-weight="bold">Odor Screening Trial</text>
  <text x="455" y="120" fill="#4d7c0f" font-family="sans-serif" font-size="11">❌ Rotten Eggs: Too slow</text>
  <text x="455" y="142" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold">✅ Wasabi: Trigeminal nerve</text>
  <text x="455" y="164" fill="#1e293b" font-family="sans-serif" font-size="10">Instant wake-up from deep sleep!</text>
</svg>