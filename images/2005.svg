<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2005" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2005)" rx="16"/>
  <!-- Snow Ground -->
  <path d="M0,290 Q180,270 360,295 T640,285 L640,380 L0,380 Z" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#1e3a8a"/>
  <text x="320" y="42" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">2005 流体力学奖：企鹅排便时产生的内部压强计算</text>
  <!-- Formula Board -->
  <rect x="40" y="74" width="215" height="118" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="54" y="98" fill="#1e3a8a" font-family="monospace" font-size="13" font-weight="bold">AVIAN FLUID DYNAMICS</text>
  <text x="54" y="120" fill="#dc2626" font-family="monospace" font-size="13">ΔP = 8·η·L·Q / (π·r⁴)</text>
  <text x="54" y="142" fill="#0f172a" font-family="sans-serif" font-size="12">▪ 峰值压强: 10 ~ 60 kPa</text>
  <text x="54" y="162" fill="#0f172a" font-family="sans-serif" font-size="12">▪ 射程半径: ~ 40 cm</text>
  <text x="54" y="181" fill="#047857" font-family="sans-serif" font-size="12" font-weight="bold">▪ 目的: 保持鸟巢整洁干净!</text>
  <!-- Pebble Nest & Penguin leaning forward -->
  <g transform="translate(410, 155)">
    <!-- Pebble Nest -->
    <ellipse cx="60" cy="140" rx="52" ry="14" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
    <circle cx="35" cy="136" r="9" fill="#6b7280"/>
    <circle cx="58" cy="138" r="10" fill="#4b5563"/>
    <circle cx="82" cy="136" r="9" fill="#6b7280"/>
    <!-- Penguin Body Leaning Forward -->
    <g transform="rotate(28 60 85)">
      <ellipse cx="60" cy="85" rx="28" ry="46" fill="#111827"/>
      <ellipse cx="68" cy="88" rx="19" ry="38" fill="#ffffff"/>
      <!-- Head & Beak -->
      <circle cx="62" cy="34" r="20" fill="#111827"/>
      <polygon points="80,28 104,34 80,40" fill="#f97316"/>
      <circle cx="70" cy="30" r="4" fill="#ffffff"/>
      <circle cx="71" cy="30" r="2" fill="#000000"/>
      <!-- Flipper -->
      <ellipse cx="52" cy="85" rx="9" ry="28" fill="#1f2937" transform="rotate(-15 52 85)"/>
    </g>
    <!-- Feet -->
    <ellipse cx="48" cy="130" rx="12" ry="5" fill="#f97316"/>
    <ellipse cx="72" cy="130" rx="12" ry="5" fill="#f97316"/>
  </g>
  <!-- High-Pressure Trajectory Arc -->
  <path d="M432,248 Q310,195 190,305" fill="none" stroke="#ca8a04" stroke-width="5" stroke-dasharray="8,5"/>
  <circle cx="190" cy="305" r="9" fill="#ca8a04"/>
  <!-- Distance Marker -->
  <line x1="190" y1="330" x2="450" y2="330" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="190" y1="323" x2="190" y2="337" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="450" y1="323" x2="450" y2="337" stroke="#dc2626" stroke-width="2.5"/>
  <text x="320" y="348" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">水平射程 d = 40 cm (比汽车轮胎气压还猛!)</text>
  <!-- Pressure Gauge Icon -->
  <g transform="translate(310, 115)">
    <circle cx="40" cy="40" r="32" fill="#fef08a" stroke="#dc2626" stroke-width="4"/>
    <line x1="40" y1="40" x2="60" y2="22" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="4" fill="#111827"/>
    <text x="40" y="62" text-anchor="middle" fill="#991b1b" font-family="monospace" font-size="11" font-weight="bold">60 kPa</text>
  </g>
</svg>