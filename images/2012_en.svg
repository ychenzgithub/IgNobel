<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2012" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="salmon2012" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2012)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" fill="#fda4af" font-family="sans-serif" font-size="16" font-weight="bold">2012 Neuroscience Prize: Meaningful Brain Activity in a Dead Salmon</text>

  <!-- fMRI Scanner Bore on Left -->
  <g transform="translate(35, 72)">
    <!-- Outer Magnet Ring -->
    <circle cx="135" cy="135" r="115" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
    <circle cx="135" cy="135" r="68" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
    <text x="135" y="45" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold">3.0T fMRI SCANNER</text>
    <!-- Magnetic Field Rings -->
    <circle cx="135" cy="135" r="56" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Scanner Patient Table -->
    <rect x="45" y="162" width="215" height="22" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
    <!-- Dead Atlantic Salmon on the Table -->
    <path d="M75,148 Q135,120 205,146 L232,130 L226,164 L205,152 Q135,172 75,148 Z" fill="url(#salmon2012)" stroke="#1e293b" stroke-width="2.5"/>
    <!-- X_X Dead Eye on Salmon -->
    <line x1="90" y1="142" x2="98" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="98" y1="142" x2="90" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Glowing Red "Active Voxels" inside Dead Fish -->
    <circle cx="112" cy="144" r="6" fill="#ef4444"/>
    <circle cx="124" cy="148" r="5" fill="#facc15"/>
    <circle cx="112" cy="144" r="11" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Label -->
    <rect x="45" y="195" width="200" height="44" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="214" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Subject: Post-Mortem Atlantic Salmon</text>
    <text x="145" y="231" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Vital Signs: 0 (100% Supermarket Dead)</text>
  </g>

  <!-- Right Side: Computer Monitor Showing False-Positive Brain Scan -->
  <g transform="translate(335, 75)">
    <rect x="0" y="0" width="270" height="190" rx="12" fill="#090d16" stroke="#475569" stroke-width="4"/>
    <text x="135" y="26" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">SALMON BRAIN ACTIVATION MAP</text>
    <!-- Sagittal Slice of Salmon with Glowing Red Blob -->
    <ellipse cx="135" cy="82" rx="85" ry="32" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="95" cy="76" r="12" fill="#ef4444"/>
    <circle cx="95" cy="76" r="6" fill="#fde047"/>
    <line x1="107" y1="70" x2="155" y2="52" stroke="#facc15" stroke-width="2"/>
    <text x="160" y="55" fill="#fde047" font-family="monospace" font-size="11" font-weight="bold">3 Glowing Voxels!</text>
    <!-- Statistical Output -->
    <text x="20" y="138" fill="#fda4af" font-family="monospace" font-size="12" font-weight="bold">▪ Tested Voxels: 130,000 voxels</text>
    <text x="20" y="158" fill="#facc15" font-family="monospace" font-size="12">▪ Uncorrected: p &lt; 0.001 (Active!)</text>
    <text x="20" y="178" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">▪ After FDR Correction: 0 Active Voxels</text>
  </g>

  <!-- Bottom Humor Banner -->
  <rect x="35" y="292" width="570" height="68" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="320" y="318" text-anchor="middle" fill="#881337" font-family="sans-serif" font-size="13" font-weight="bold">Task: Show human social photos to a dead fish and ask what emotion the person feels</text>
  <text x="320" y="344" text-anchor="middle" fill="#be123c" font-family="sans-serif" font-size="12">Lesson: Without multiple-comparisons correction, fancy fMRI finds empathy in dead fish!</text>
</svg>