<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2016" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="hill2016" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#sky2016)"/>
  <!-- Alpine Mountains -->
  <polygon points="40,240 160,70 280,240" fill="#64748b"/>
  <polygon points="160,70 120,130 145,125 160,140 175,122 200,130" fill="#f8fafc"/>
  <polygon points="220,240 370,50 520,240" fill="#475569"/>
  <polygon points="370,50 320,120 350,112 370,130 390,110 420,120" fill="#ffffff"/>
  <polygon points="430,240 550,90 660,240" fill="#64748b"/>
  <polygon points="550,90 515,140 550,132 585,140" fill="#f8fafc"/>
  <!-- Green Alpine Slope -->
  <path d="M 0 210 Q 220 175 440 205 Q 560 220 640 195 L 640 380 L 0 380 Z" fill="url(#hill2016)"/>
  <!-- Left: Charles Foster in Badger Burrow -->
  <g>
    <ellipse cx="115" cy="275" rx="68" ry="26" fill="#451a03" stroke="#78350f" stroke-width="4"/>
    <ellipse cx="115" cy="278" rx="52" ry="16" fill="#1c1917"/>
    <!-- Foster popping out -->
    <circle cx="115" cy="250" r="20" fill="#fed7aa" stroke="#78350f" stroke-width="1.5"/>
    <!-- Badger stripes painted on face -->
    <path d="M 105 232 L 105 262 M 125 232 L 125 262" stroke="#1e293b" stroke-width="4"/>
    <circle cx="107" cy="246" r="2.5" fill="#0f172a"/>
    <circle cx="123" cy="246" r="2.5" fill="#0f172a"/>
    <!-- Wriggling earthworm in mouth -->
    <path d="M 112 260 Q 128 265 138 255 Q 148 245 156 258" fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="28" y="182" width="165" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="110" y="204" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="12" font-weight="bold">查尔斯·福斯特：獾洞吃蚯蚓</text>
  </g>
  <!-- Center: Thomas Thwaites as GoatMan on Prosthetic Limbs -->
  <g>
    <!-- Torso tilted forward -->
    <rect x="255" y="185" width="85" height="38" rx="14" transform="rotate(12 295 204)" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <!-- Artificial Rumen Bag strapped to belly -->
    <ellipse cx="292" cy="226" rx="22" ry="12" fill="#a3e635" stroke="#3f6212" stroke-width="2"/>
    <text x="292" y="230" text-anchor="middle" fill="#1a2e05" font-family="sans-serif" font-size="9" font-weight="bold">人工瘤胃</text>
    <!-- Hind prosthetic legs -->
    <polyline points="262,210 242,245 252,290" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <rect x="244" y="286" width="14" height="8" rx="3" fill="#0f172a"/>
    <!-- Front prosthetic legs -->
    <polyline points="328,215 342,252 335,292" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <rect x="328" y="288" width="14" height="8" rx="3" fill="#0f172a"/>
    <circle cx="342" cy="252" r="5" fill="#ef4444"/>
    <circle cx="242" cy="245" r="5" fill="#ef4444"/>
    <!-- Head with Blue Helmet grazing grass -->
    <circle cx="356" cy="212" r="18" fill="#fed7aa"/>
    <path d="M 338 206 A 18 18 0 0 1 374 206 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="362" cy="214" r="2.5" fill="#0f172a"/>
    <!-- Grass tuft in mouth -->
    <path d="M 370 222 L 388 216 M 370 222 L 390 224 M 370 222 L 385 231" stroke="#fde047" stroke-width="2.5"/>
    <!-- Speech bubble -->
    <rect x="235" y="122" width="165" height="42" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <polygon points="340,164 352,182 358,164" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="317" y="141" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="12" font-weight="bold">托马斯·思韦茨 (GoatMan)</text>
    <text x="317" y="157" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">“咩～给做人放个假真爽！”</text>
  </g>
  <!-- Right: Confused Real Alpine Goat -->
  <g>
    <ellipse cx="505" cy="238" rx="42" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Goat legs -->
    <line x1="478" y1="258" x2="475" y2="292" stroke="#e2e8f0" stroke-width="5"/>
    <line x1="492" y1="260" x2="492" y2="294" stroke="#cbd5e1" stroke-width="5"/>
    <line x1="522" y1="260" x2="520" y2="294" stroke="#e2e8f0" stroke-width="5"/>
    <line x1="535" y1="258" x2="538" y2="292" stroke="#cbd5e1" stroke-width="5"/>
    <!-- Goat neck and head -->
    <path d="M 472 232 L 455 195 L 435 202 L 455 220 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Horns & Beard -->
    <path d="M 455 195 Q 468 172 485 182" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 442 212 L 436 226" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="448" cy="202" r="2.5" fill="#0f172a"/>
    <!-- Question marks from goat -->
    <rect x="445" y="132" width="165" height="36" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="527" y="155" text-anchor="middle" fill="#854d0e" font-family="sans-serif" font-size="12" font-weight="bold">真山羊：“这新来的咋戴头盔？”</text>
  </g>
  <!-- Bottom Banner -->
  <rect x="20" y="322" width="600" height="42" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="320" y="348" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="13" font-weight="bold">2016 生物学奖：穿假肢当山羊 &amp; 钻地洞当狗獾——从做人这件事里放个假</text>
</svg>