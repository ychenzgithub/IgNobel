<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg98" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="65%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="armor98" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg98)" rx="16"/>
  <!-- Pine Trees Background -->
  <g fill="#047857" opacity="0.45">
    <polygon points="70,80 30,220 110,220"/>
    <polygon points="70,140 20,290 120,290"/>
    <polygon points="150,95 115,240 185,240"/>
    <polygon points="510,85 470,230 550,230"/>
    <polygon points="575,110 535,270 615,270"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="305" width="640" height="75" fill="#14532d"/>
  <!-- Troy Hurtubise in Ursus Mark VI Armor (Left-Center) -->
  <g transform="translate(205, 185)">
    <!-- Legs -->
    <rect x="-38" y="55" width="30" height="62" rx="8" fill="url(#armor98)" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="8" y="55" width="30" height="62" rx="8" fill="url(#armor98)" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-42" y="105" width="38" height="18" rx="6" fill="#eab308" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="4" y="105" width="38" height="18" rx="6" fill="#eab308" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Bulky Torso -->
    <rect x="-52" y="-35" width="104" height="95" rx="18" fill="url(#armor98)" stroke="#1e293b" stroke-width="3"/>
    <!-- Yellow hazard chest plate -->
    <rect x="-36" y="-20" width="72" height="52" rx="8" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
    <text x="0" y="2" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">URSUS MK-VI</text>
    <text x="0" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">ANTI-BEAR</text>
    <!-- Shoulder Pads & Arms -->
    <circle cx="-62" cy="-18" r="22" fill="#eab308" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="62" cy="-18" r="22" fill="#eab308" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-76" y="0" width="26" height="52" rx="10" fill="url(#armor98)" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="50" y="0" width="26" height="52" rx="10" fill="url(#armor98)" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Helmet -->
    <rect x="-32" y="-88" width="64" height="54" rx="16" fill="url(#armor98)" stroke="#1e293b" stroke-width="3"/>
    <rect x="-22" y="-72" width="44" height="18" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <!-- Duct tape strips for humor -->
    <rect x="-45" y="34" width="28" height="8" transform="rotate(-18 -31 38)" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="20" y="-32" width="26" height="8" transform="rotate(22 33 -28)" fill="#cbd5e1" stroke="#64748b"/>
  </g>
  <!-- Impact Sparks / Bounce Arrows -->
  <g stroke="#facc15" stroke-width="3" fill="none">
    <path d="M292 150 L318 135 M296 168 L328 165 M292 186 L320 202"/>
  </g>
  <polygon points="288,165 302,154 300,163 312,160 296,175 298,166" fill="#fde047"/>

  <!-- Bewildered Giant Grizzly Bear (Right) -->
  <g transform="translate(435, 195)">
    <!-- Bear Body -->
    <ellipse cx="0" cy="25" rx="68" ry="82" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <ellipse cx="-8" cy="30" rx="42" ry="55" fill="#92400e"/>
    <!-- Bear Head -->
    <circle cx="-12" cy="-65" r="42" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="-42" cy="-98" r="14" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="18" cy="-98" r="14" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <!-- Snout -->
    <ellipse cx="-20" cy="-55" rx="22" ry="16" fill="#d97706"/>
    <ellipse cx="-28" cy="-60" rx="7" ry="5" fill="#1e293b"/>
    <!-- Puzzled Eyes & Sweat Drop -->
    <circle cx="-26" cy="-76" r="5" fill="#ffffff"/>
    <circle cx="-26" cy="-76" r="2.5" fill="#0f172a"/>
    <circle cx="-4" cy="-76" r="5" fill="#ffffff"/>
    <circle cx="-4" cy="-76" r="2.5" fill="#0f172a"/>
    <path d="M26 -82 Q32 -70 26 -66 Q20 -70 26 -82 Z" fill="#38bdf8"/>
    <!-- Question Marks above Bear -->
    <text x="-15" y="-118" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fde047">??? UNCHEWABLE?!</text>
    <!-- Bear Paw holding a bent club/bat -->
    <ellipse cx="-65" cy="-5" rx="24" ry="15" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <path d="M-78 -12 L-115 -45 L-135 -25" stroke="#b45309" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Test Checklist Badge Top Left -->
  <rect x="24" y="24" width="215" height="96" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#facc15" stroke-width="2"/>
  <text x="38" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde047">Project Grizzly Impact Tests:</text>
  <text x="38" y="68" font-family="sans-serif" font-size="12" fill="#e2e8f0">☑ Hit by Pickup Truck 18x</text>
  <text x="38" y="88" font-family="sans-serif" font-size="12" fill="#e2e8f0">☑ Baseball Bats &amp; Cliff Drop</text>
  <text x="38" y="108" font-family="sans-serif" font-size="12" fill="#4ade80">☑ Grizzly Bear Confusion: 100%</text>

  <!-- Bottom Banner -->
  <rect x="24" y="336" width="592" height="32" rx="8" fill="#facc15"/>
  <text x="320" y="357" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">1998 Safety Engineering · Troy Hurtubise: Developing &amp; Testing Grizzly-Proof Armor</text>
</svg>