<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2004" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2004)" rx="16"/>
  <!-- Court Floor -->
  <rect x="20" y="260" width="600" height="105" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <line x1="20" y1="295" x2="620" y2="295" stroke="#fef3c7" stroke-width="3"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#0369a1"/>
  <text x="320" y="42" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">2004 心理学奖：看不见的大猩猩（无意视盲实验）</text>
  <!-- Left Basketball Player (White Team) -->
  <g transform="translate(75, 145)">
    <circle cx="35" cy="25" r="18" fill="#fed7aa" stroke="#9a3412" stroke-width="2.5"/>
    <rect x="18" y="45" width="34" height="55" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="35" y="78" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">白队</text>
    <line x1="25" y1="100" x2="18" y2="145" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="52" y2="145" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <!-- Passing trajectory -->
    <path d="M60,55 Q195,-15 340,55" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="120" cy="30" r="15" fill="#ea580c" stroke="#7c2d12" stroke-width="2.5"/>
  </g>
  <!-- Right Basketball Player (White Team) -->
  <g transform="translate(395, 145)">
    <circle cx="35" cy="25" r="18" fill="#fed7aa" stroke="#9a3412" stroke-width="2.5"/>
    <rect x="18" y="45" width="34" height="55" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="35" y="78" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">白队</text>
    <line x1="25" y1="100" x2="18" y2="145" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="52" y2="145" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Giant Gorilla in the Center! -->
  <g transform="translate(215, 85)">
    <!-- Gorilla Halo / Spotlight -->
    <circle cx="65" cy="105" r="78" fill="#fef08a" opacity="0.55"/>
    <!-- Gorilla Body & Limbs -->
    <ellipse cx="65" cy="125" rx="48" ry="56" fill="#374151" stroke="#111827" stroke-width="3"/>
    <ellipse cx="65" cy="128" rx="28" ry="35" fill="#4b5563"/>
    <!-- Arms beating chest -->
    <path d="M22,95 Q-10,115 38,125" fill="none" stroke="#374151" stroke-width="18" stroke-linecap="round"/>
    <path d="M108,95 Q140,115 92,125" fill="none" stroke="#374151" stroke-width="18" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="42" y1="175" x2="35" y2="215" stroke="#1f2937" stroke-width="16" stroke-linecap="round"/>
    <line x1="88" y1="175" x2="95" y2="215" stroke="#1f2937" stroke-width="16" stroke-linecap="round"/>
    <!-- Gorilla Head -->
    <circle cx="65" cy="58" r="30" fill="#374151" stroke="#111827" stroke-width="3"/>
    <ellipse cx="65" cy="66" rx="18" ry="13" fill="#6b7280"/>
    <circle cx="55" cy="50" r="4.5" fill="#ffffff"/>
    <circle cx="55" cy="50" r="2" fill="#000000"/>
    <circle cx="75" cy="50" r="4.5" fill="#ffffff"/>
    <circle cx="75" cy="50" r="2" fill="#000000"/>
    <path d="M54,70 Q65,78 76,70" stroke="#111827" stroke-width="2.5" fill="none"/>
    <!-- Thump sound effects -->
    <text x="5" y="80" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">咚! 咚!</text>
    <text x="95" y="80" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">吼吼!</text>
    <rect x="8" y="-12" width="115" height="28" rx="8" fill="#dc2626"/>
    <text x="65" y="7" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">50%的人看不见我!</text>
  </g>
  <!-- Oblivious Observer on the Right -->
  <g transform="translate(495, 92)">
    <rect x="-10" y="0" width="125" height="90" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <text x="52" y="24" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="13" font-weight="bold">受试者脑内：</text>
    <text x="52" y="46" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12">“13次、14次、15次…”</text>
    <text x="52" y="68" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="12" font-weight="bold">“啥大猩猩？没见过！”</text>
  </g>
</svg>