<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2010" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sea2010" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#sky2010)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#0c4a6e"/>
  <text x="320" y="42" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">2010 工程学奖：用遥控直升机收集鲸鱼鼻涕</text>

  <!-- Ocean Water -->
  <path d="M0,265 Q80,252 160,265 T320,265 T480,265 T640,265 L640,380 L0,380 Z" fill="url(#sea2010)"/>

  <!-- Giant Surfacing Whale on Left -->
  <g transform="translate(40, 215)">
    <path d="M10,65 Q60,5 190,25 Q255,35 280,68 L10,68 Z" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <!-- Whale Eye -->
    <circle cx="75" cy="48" r="6" fill="#ffffff"/>
    <circle cx="77" cy="48" r="3" fill="#000000"/>
    <!-- Whale Smile -->
    <path d="M25,58 Q55,66 85,56" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Blowhole Snot Plume (Mist + Green/Blue Mucus Droplets) -->
    <path d="M145,22 Q130,-55 95,-115 M150,22 Q150,-65 150,-130 M155,22 Q170,-55 205,-115" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.85"/>
    <circle cx="135" cy="-85" r="8" fill="#84cc16" opacity="0.9"/>
    <circle cx="165" cy="-95" r="10" fill="#a3e635" opacity="0.9"/>
    <circle cx="148" cy="-60" r="7" fill="#4ade80" opacity="0.9"/>
    <circle cx="122" cy="-50" r="6" fill="#bef264" opacity="0.9"/>
    <text x="150" y="95" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="13" font-weight="bold">蓝鲸：“阿——嚏！！（富含微生物与DNA的鼻涕喷泉）”</text>
  </g>

  <!-- Remote-Control Helicopter Hovering in the Plume -->
  <g transform="translate(135, 82)">
    <!-- Spinning Rotor Blades -->
    <ellipse cx="60" cy="8" rx="68" ry="6" fill="#475569" opacity="0.6"/>
    <line x1="-8" y1="8" x2="128" y2="8" stroke="#1e293b" stroke-width="3"/>
    <rect x="56" y="8" width="8" height="12" fill="#334155"/>
    <!-- Helicopter Fuselage -->
    <ellipse cx="55" cy="32" rx="34" ry="18" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
    <path d="M22,26 Q35,16 52,22 L52,38 Q32,40 22,26 Z" fill="#fef08a"/>
    <!-- Tail Boom & Rotor -->
    <line x1="88" y1="30" x2="142" y2="24" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="144" cy="24" r="10" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Landing Skids with Petri Dishes -->
    <line x1="38" y1="48" x2="32" y2="62" stroke="#1e293b" stroke-width="3"/>
    <line x1="72" y1="48" x2="78" y2="62" stroke="#1e293b" stroke-width="3"/>
    <line x1="18" y1="62" x2="92" y2="62" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Petri Dishes Attached to Skids -->
    <ellipse cx="38" cy="66" rx="14" ry="5" fill="#ecfccb" stroke="#16a34a" stroke-width="2"/>
    <ellipse cx="72" cy="66" rx="14" ry="5" fill="#ecfccb" stroke="#16a34a" stroke-width="2"/>
    <text x="55" y="86" text-anchor="middle" fill="#14532d" font-family="sans-serif" font-size="11" font-weight="bold">培养皿已接满鲸鱼鼻涕！</text>
  </g>

  <!-- Research Boat & Scientists on Right -->
  <g transform="translate(415, 165)">
    <!-- Radio Control Waves -->
    <path d="M15,20 Q-30,-5 -75,-20 M10,35 Q-40,15 -85,0" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,5"/>
    <!-- Researcher with RC Transmitter -->
    <circle cx="75" cy="25" r="16" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
    <rect x="58" y="42" width="34" height="48" rx="6" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <!-- RC Controller & Antenna -->
    <rect x="22" y="42" width="28" height="22" rx="4" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="26" y1="42" x2="5" y2="12" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="5" cy="12" r="3.5" fill="#ef4444"/>
    <!-- Boat Hull -->
    <polygon points="0,85 185,85 160,125 25,125" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <rect x="20" y="92" width="145" height="10" fill="#0284c7"/>
    <text x="92" y="116" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold">SNOT-BOT EXPRESS</text>
  </g>

  <!-- Info Box Top Right -->
  <rect x="360" y="70" width="255" height="78" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="375" y="92" fill="#0c4a6e" font-family="sans-serif" font-size="13" font-weight="bold">非侵入式鲸类疾病监测神器：</text>
  <text x="375" y="114" fill="#334155" font-family="sans-serif" font-size="12">▪ 遥控飞机挂培养皿低空掠过喷气柱</text>
  <text x="375" y="134" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold">▪ 鲸鱼毫无察觉，科研人员满载而归</text>
</svg>