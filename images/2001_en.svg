<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paper01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg01)" rx="16"/>
  <!-- Left Side: 3500 BC Caveman Shocked -->
  <g transform="translate(105, 200)">
    <rect x="-75" y="-145" width="150" height="32" rx="8" fill="#292524" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="-124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">3500 BC · Stone Age Inventor</text>
    <!-- Caveman Body -->
    <path d="M-32 95 L-22 10 L22 10 L32 95 Z" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>
    <!-- Leopard spots on tunic -->
    <circle cx="-8" cy="35" r="4" fill="#451a03"/>
    <circle cx="10" cy="52" r="5" fill="#451a03"/>
    <circle cx="-6" cy="70" r="4.5" fill="#451a03"/>
    <!-- Head & Messy Beard/Hair -->
    <circle cx="0" cy="-16" r="24" fill="#fed7aa" stroke="#78350f" stroke-width="2"/>
    <path d="M-26 -18 Q-30 -48 0 -45 Q30 -48 26 -18 Z" fill="#451a03"/>
    <path d="M-20 -8 Q0 18 20 -8" fill="#451a03"/>
    <!-- Shocked Eyes & Jaw Drop -->
    <circle cx="-8" cy="-20" r="6" fill="#ffffff"/><circle cx="-8" cy="-20" r="2.5" fill="#000"/>
    <circle cx="10" cy="-20" r="6" fill="#ffffff"/><circle cx="10" cy="-20" r="2.5" fill="#000"/>
    <ellipse cx="2" cy="-4" rx="7" ry="9" fill="#991b1b"/>
    <text x="0" y="-58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef08a" text-anchor="middle">I INVENTED THAT 5,000 YEARS AGO?!</text>
  </g>

  <!-- Center: The Newly Patented Wheel on a Pedestal -->
  <g transform="translate(310, 195)">
    <rect x="-70" y="88" width="140" height="32" rx="6" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="109" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Circular Transportation Device</text>
    <!-- Outer Wheel Rim -->
    <circle cx="0" cy="8" r="74" fill="none" stroke="#f59e0b" stroke-width="16"/>
    <circle cx="0" cy="8" r="82" fill="none" stroke="#78350f" stroke-width="3"/>
    <circle cx="0" cy="8" r="66" fill="none" stroke="#78350f" stroke-width="2.5"/>
    <!-- Spokes -->
    <g stroke="#d97706" stroke-width="7">
      <line x1="0" y1="-58" x2="0" y2="74"/>
      <line x1="-66" y1="8" x2="66" y2="8"/>
      <line x1="-47" y1="-39" x2="47" y2="55"/>
      <line x1="-47" y1="55" x2="47" y2="-39"/>
    </g>
    <!-- Hub -->
    <circle cx="0" cy="8" r="18" fill="#fbbf24" stroke="#451a03" stroke-width="3"/>
    <circle cx="0" cy="8" r="6" fill="#451a03"/>
    <!-- Dimension Callouts -->
    <path d="M-85 -75 L85 -75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-82" font-family="monospace" font-size="12" font-weight="bold" fill="#7dd3fc" text-anchor="middle">R = 360° Novel Concept: Round &amp; Rolls!</text>
  </g>

  <!-- Right Side: Official Australian Patent Certificate #2001100012 -->
  <g transform="translate(430, 52)">
    <rect x="0" y="0" width="186" height="255" rx="10" fill="url(#paper01)" stroke="#d97706" stroke-width="3"/>
    <rect x="10" y="10" width="166" height="235" rx="6" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="93" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Australian Patent Office</text>
    <text x="93" y="54" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">PATENT #2001100012</text>
    <line x1="24" y1="64" x2="162" y2="64" stroke="#d97706" stroke-width="1.5"/>
    <text x="93" y="86" font-family="sans-serif" font-size="11.5" fill="#451a03" text-anchor="middle">Inventor: John Keogh</text>
    <text x="93" y="106" font-family="sans-serif" font-size="11.5" fill="#451a03" text-anchor="middle">Filing Year: 2001 AD</text>
    <text x="93" y="126" font-family="sans-serif" font-size="11.5" fill="#451a03" text-anchor="middle">Subject: 'The Wheel'</text>
    <!-- Giant Red APPROVED Stamp -->
    <g transform="translate(93, 182) rotate(-14)">
      <rect x="-72" y="-28" width="144" height="56" rx="8" fill="none" stroke="#dc2626" stroke-width="4"/>
      <text x="0" y="-4" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">APPROVED!</text>
      <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Granted Without Exam!</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="24" y="336" width="592" height="32" rx="8" fill="#f59e0b"/>
  <text x="320" y="357" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">2001 Technology Prize · John Keogh &amp; Australian Patent Office: Patenting the Wheel in 2001</text>
</svg>