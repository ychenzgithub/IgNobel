<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2007" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2007)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#065f46"/>
  <text x="320" y="42" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">2007 营养学奖：自动续杯的“无底洞汤碗”与人类食欲</text>
  <!-- Diner at Table -->
  <g transform="translate(150, 75)">
    <!-- Head & Happy Face -->
    <circle cx="95" cy="45" r="26" fill="#fed7aa" stroke="#9a3412" stroke-width="2.5"/>
    <circle cx="86" cy="39" r="3.5" fill="#111827"/>
    <circle cx="104" cy="39" r="3.5" fill="#111827"/>
    <path d="M85,53 Q95,63 105,53" stroke="#dc2626" stroke-width="3" fill="none"/>
    <!-- Napkin & Torso -->
    <rect x="65" y="72" width="60" height="65" rx="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
    <polygon points="85,72 105,72 112,108 78,108" fill="#ffffff"/>
    <!-- Speech Bubble -->
    <rect x="-110" y="5" width="185" height="54" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
    <text x="-17" y="28" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="12" font-weight="bold">“奇了怪了，喝了半小时</text>
    <text x="-17" y="48" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">怎么碗里还有大半碗？！”</text>
    <!-- Soup Bowl on Table -->
    <path d="M55,112 L135,112 L122,138 L68,138 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <ellipse cx="95" cy="114" rx="36" ry="7" fill="#ef4444"/>
  </g>
  <!-- Dining Table with Tablecloth -->
  <rect x="110" y="212" width="270" height="16" rx="4" fill="#78350f"/>
  <line x1="135" y1="228" x2="135" y2="355" stroke="#78350f" stroke-width="10"/>
  <line x1="355" y1="228" x2="355" y2="355" stroke="#78350f" stroke-width="10"/>
  <!-- Secret Under-Table Refill Pipe! -->
  <path d="M245,212 L245,310 L455,310 L455,260" fill="none" stroke="#9ca3af" stroke-width="14" stroke-linejoin="round"/>
  <path d="M245,212 L245,310 L455,310 L455,260" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="10,6" stroke-linejoin="round"/>
  <text x="345" y="335" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="13" font-weight="bold">⬅ 桌下隐藏输汤暗管 (自动缓慢续汤)</text>
  <!-- Giant Soup Vat & Researcher on the Right -->
  <g transform="translate(415, 110)">
    <rect x="10" y="40" width="110" height="135" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
    <rect x="20" y="65" width="90" height="95" rx="6" fill="#ef4444"/>
    <text x="65" y="105" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">番茄浓汤罐</text>
    <text x="65" y="128" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="13" font-weight="bold">+73% 摄入量!</text>
    <!-- Data Badge -->
    <rect x="-15" y="-25" width="195" height="52" rx="8" fill="#ffffff" stroke="#065f46" stroke-width="2.5"/>
    <text x="82" y="-3" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="12" font-weight="bold">结论：人吃饱靠眼睛看碗底</text>
    <text x="82" y="16" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="12">而不是靠胃部真实饱腹感！</text>
  </g>
</svg>