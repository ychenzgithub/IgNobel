<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg96" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg96)"/>
  <rect x="0" y="295" width="640" height="85" fill="#451a03"/>
  <ellipse cx="350" cy="318" rx="165" ry="22" fill="#991b1b" stroke="#fbbf24" stroke-width="3"/>
  <text x="445" y="323" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold">昂贵波斯地毯</text>

  <rect x="18" y="14" width="380" height="44" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="30" y="33" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">1996 物理学奖 · 英国阿斯顿大学 罗伯特·马修斯</text>
  <text x="30" y="50" fill="#ffffff" font-family="sans-serif" font-size="11">《翻滚的吐司、墨菲定律与宇宙基本常数》：黄油面必朝下</text>

  <rect x="25" y="135" width="165" height="16" rx="4" fill="#b45309" stroke="#fde68a" stroke-width="2"/>
  <rect x="50" y="151" width="18" height="150" fill="#78350f"/>
  <rect x="145" y="151" width="18" height="150" fill="#78350f"/>
  <line x1="18" y1="142" x2="18" y2="300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="24" y="225" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">h ≈ 0.75m</text>

  <path d="M175 130 Q265 145 315 305" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="7,5"/>

  <g transform="translate(175, 118) rotate(28)">
    <rect x="-26" y="-8" width="52" height="14" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <rect x="-22" y="-13" width="44" height="6" rx="3" fill="#fef08a"/>
    <text x="-18" y="-17" fill="#fef08a" font-family="sans-serif" font-size="9" font-weight="bold">黄油朝上</text>
  </g>

  <g transform="translate(255, 205) rotate(115)">
    <rect x="-30" y="-9" width="60" height="16" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <rect x="-25" y="-15" width="50" height="7" rx="3" fill="#fef08a"/>
  </g>
  <path d="M225 185 A35 35 0 0 1 285 188" fill="none" stroke="#fb7185" stroke-width="2.5"/>
  <text x="275" y="178" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">仅够翻转半圈 (180°)</text>

  <g transform="translate(318, 308)">
    <ellipse cx="0" cy="6" rx="44" ry="10" fill="#facc15"/>
    <rect x="-32" y="-8" width="64" height="14" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <text x="-38" y="-16" fill="#fef08a" font-family="sans-serif" font-size="12" font-weight="bold">啪叽！黄油面朝下！</text>
  </g>

  <rect x="385" y="72" width="235" height="195" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
  <text x="402" y="98" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="bold">墨菲定律的宇宙常数推导</text>
  <line x1="402" y1="108" x2="600" y2="108" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="402" y="132" fill="#fef08a" font-family="monospace" font-size="12">ω = √(6g / a) · θ₀</text>
  <text x="402" y="156" fill="#e2e8f0" font-family="sans-serif" font-size="12">• 地球重力加速度 g = 9.8 m/s²</text>
  <text x="402" y="178" fill="#e2e8f0" font-family="sans-serif" font-size="12">• 人类身高由精细结构常数 α</text>
  <text x="402" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="12">  与玻尔半径决定 → 餐桌高0.75m</text>
  <rect x="402" y="212" width="202" height="40" rx="6" fill="#312e81"/>
  <text x="412" y="230" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">结论：只要宇宙常数不变，</text>
  <text x="412" y="246" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">吐司掉下餐桌就注定黄油朝下！</text>

  <rect x="85" y="338" width="470" height="32" rx="16" fill="#d97706"/>
  <text x="320" y="359" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">别怪运气差！从宇宙大爆炸确定基本常数的那一刻起，你的吐司就注定脏地毯！</text>
</svg>