<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg91" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="water91" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow91" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="640" height="380" fill="url(#bg91)"/>
  <!-- Lab shelf & grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="640" y2="70"/>
    <line x1="0" y1="140" x2="640" y2="140"/>
    <line x1="0" y1="210" x2="640" y2="210"/>
    <line x1="0" y1="280" x2="640" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
  </g>
  <!-- Lab Bench -->
  <rect x="0" y="315" width="640" height="65" fill="#1e293b"/>
  <rect x="0" y="315" width="640" height="6" fill="#475569"/>

  <!-- Title Banner -->
  <rect x="18" y="14" width="280" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="30" y="33" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">1991 化学奖 · 雅克·本维尼斯特</text>
  <text x="30" y="49" fill="#e2e8f0" font-family="sans-serif" font-size="11">“水具有记忆力”与高智商 H₂O 假说</text>

  <!-- Glow behind Beaker -->
  <circle cx="310" cy="210" r="130" fill="url(#glow91)"/>

  <!-- Giant Lab Beaker -->
  <path d="M210 95 L220 95 L220 305 Q220 320 235 320 L385 320 Q400 320 400 305 L400 95 L410 95" fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>
  <path d="M223 150 Q265 142 310 150 T397 150 L397 303 Q397 316 384 316 L236 316 Q223 316 223 303 Z" fill="url(#water91)"/>
  <!-- Beaker Measurement Marks -->
  <g stroke="#e0f2fe" stroke-width="2" opacity="0.8">
    <line x1="365" y1="180" x2="390" y2="180"/>
    <line x1="375" y1="210" x2="390" y2="210"/>
    <line x1="365" y1="240" x2="390" y2="240"/>
    <line x1="375" y1="270" x2="390" y2="270"/>
  </g>
  <text x="325" y="184" fill="#e0f2fe" font-family="monospace" font-size="10">10⁻¹²⁰ mol</text>
  <text x="330" y="244" fill="#e0f2fe" font-family="monospace" font-size="10">0.00% 溶质</text>

  <!-- Anthropomorphic Smart Water Drop with Graduation Cap -->
  <path d="M305 168 C305 168 260 222 260 255 C260 282 280 300 305 300 C330 300 350 282 350 255 C350 222 305 168 305 168 Z" fill="#7dd3fc" stroke="#ffffff" stroke-width="3"/>
  <!-- Mortarboard (Graduation Cap) -->
  <polygon points="305,148 265,165 305,180 345,165" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
  <rect x="288" y="173" width="34" height="10" rx="2" fill="#1e293b"/>
  <path d="M335 168 Q348 182 346 198" fill="none" stroke="#facc15" stroke-width="2.5"/>
  <circle cx="346" cy="199" r="3.5" fill="#facc15"/>
  <!-- Glasses & Intelligent Face on Water Drop -->
  <circle cx="290" cy="238" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="320" cy="238" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="301" y1="238" x2="309" y2="238" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="292" cy="236" r="4" fill="#0f172a"/>
  <circle cx="322" cy="236" r="4" fill="#0f172a"/>
  <path d="M292 260 Q305 272 318 260" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <!-- Water Drop holding a tiny diary "H2O Diary" -->
  <rect x="242" y="252" width="32" height="40" rx="3" transform="rotate(-15 242 252)" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="243" y="275" transform="rotate(-15 242 252)" fill="#713f12" font-family="sans-serif" font-size="8" font-weight="bold">水分子</text>
  <text x="243" y="286" transform="rotate(-15 242 252)" fill="#713f12" font-family="sans-serif" font-size="8" font-weight="bold">回忆录</text>

  <!-- Nostalgic Thought Bubble (Water Remembering Vanished Molecule) -->
  <circle cx="355" cy="140" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="372" cy="122" r="10" fill="#ffffff" opacity="0.9"/>
  <rect x="385" y="22" width="235" height="125" rx="22" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
  <!-- Photo frame inside thought bubble -->
  <rect x="400" y="36" width="76" height="82" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <!-- Ghostly Antibody Molecule in Frame -->
  <path d="M425 65 L438 82 L451 65 M438 82 L438 102" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,2"/>
  <circle cx="425" cy="62" r="5" fill="#ec4899"/>
  <circle cx="451" cy="62" r="5" fill="#ec4899"/>
  <text x="412" y="113" fill="#92400e" font-family="sans-serif" font-size="9" font-weight="bold">初恋抗体君</text>
  <!-- Thought Text -->
  <text x="486" y="55" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">“虽然你已被稀释</text>
  <text x="486" y="75" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">了 10¹²⁰ 倍、早</text>
  <text x="486" y="95" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">就灰飞烟灭……</text>
  <text x="486" y="118" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="bold">但我H₂O记得你！”</text>

  <!-- Scientist (Benveniste) on Left -->
  <path d="M65 230 L155 230 L168 320 L52 320 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M98 230 L110 275 L122 230" fill="#1e293b"/>
  <path d="M107 240 L113 240 L115 270 L105 270 Z" fill="#ef4444"/>
  <path d="M72 175 Q60 155 82 152 Q95 135 115 148 Q138 138 145 160 Q160 170 145 190 Z" fill="#e2e8f0"/>
  <circle cx="110" cy="190" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="101" cy="184" r="4" fill="#0f172a"/>
  <circle cx="121" cy="184" r="4" fill="#0f172a"/>
  <path d="M96 202 Q110 195 126 202" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 245 L195 205" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <rect x="172" y="148" width="46" height="58" rx="3" transform="rotate(12 172 148)" fill="#dc2626" stroke="#fef2f2" stroke-width="2"/>
  <text x="179" y="170" transform="rotate(12 172 148)" fill="#ffffff" font-family="serif" font-size="11" font-weight="bold">Nature</text>
  <text x="178" y="186" transform="rotate(12 172 148)" fill="#fef08a" font-family="sans-serif" font-size="8">水有记忆!</text>

  <!-- Right Side: Dilution Test Tubes Rack -->
  <rect x="445" y="255" width="165" height="60" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <g>
    <rect x="462" y="195" width="22" height="105" rx="11" fill="#38bdf8" fill-opacity="0.35" stroke="#bae6fd" stroke-width="2"/>
    <rect x="500" y="195" width="22" height="105" rx="11" fill="#38bdf8" fill-opacity="0.35" stroke="#bae6fd" stroke-width="2"/>
    <rect x="538" y="195" width="22" height="105" rx="11" fill="#38bdf8" fill-opacity="0.35" stroke="#bae6fd" stroke-width="2"/>
    <rect x="576" y="195" width="22" height="105" rx="11" fill="#38bdf8" fill-opacity="0.35" stroke="#bae6fd" stroke-width="2"/>
  </g>
  <text x="458" y="285" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">无限稀释流水线 (100%纯水)</text>

  <!-- Bottom Caption Ribbon -->
  <rect x="120" y="334" width="400" height="32" rx="16" fill="#0284c7"/>
  <text x="320" y="355" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">首届搞笑诺贝尔化学奖：就算分子不在了，水还记得它的爱！</text>
</svg>