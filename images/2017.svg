<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2017" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="catOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2017)"/>
  <!-- Lab Table -->
  <rect x="0" y="295" width="640" height="85" fill="#334155"/>
  <line x1="0" y1="295" x2="640" y2="295" stroke="#94a3b8" stroke-width="3"/>
  <!-- Blackboard on Left/Top -->
  <rect x="28" y="24" width="235" height="135" rx="6" fill="#064e3b" stroke="#b45309" stroke-width="5"/>
  <text x="145" y="52" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold">《论猫的流变学》</text>
  <text x="45" y="80" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold">De = τ / t_obs</text>
  <text x="45" y="104" fill="#a7f3d0" font-family="sans-serif" font-size="11">• τ : 猫咪松弛时间 (1s~1min)</text>
  <text x="45" y="124" fill="#a7f3d0" font-family="sans-serif" font-size="11">• De &gt;&gt; 1 : 固态弹跳猫</text>
  <text x="45" y="144" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="bold">• De &lt;&lt; 1 : 液态流动猫！</text>
  <!-- Center-Left: Giant Wine Glass with Liquid Orange Cat -->
  <g>
    <!-- Wine glass stem & base -->
    <line x1="165" y1="235" x2="165" y2="292" stroke="#bae6fd" stroke-width="6"/>
    <ellipse cx="165" cy="292" rx="45" ry="7" fill="#bae6fd" opacity="0.7"/>
    <!-- Liquid Orange Cat filling the bowl -->
    <path d="M 102 152 Q 130 160 165 154 Q 200 148 228 152 C 228 210 198 235 165 235 C 132 235 102 210 102 152 Z" fill="url(#catOrange)"/>
    <!-- Tabby stripes inside liquid -->
    <path d="M 118 185 Q 165 198 212 185" fill="none" stroke="#9a3412" stroke-width="4" opacity="0.6"/>
    <path d="M 128 208 Q 165 218 202 208" fill="none" stroke="#9a3412" stroke-width="4" opacity="0.6"/>
    <!-- Cat Ears & Face poking above liquid surface -->
    <polygon points="122,155 132,125 148,152" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
    <polygon points="182,152 198,125 208,155" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Smug closed eyes & whiskers -->
    <path d="M 140 168 Q 148 162 156 168" fill="none" stroke="#431407" stroke-width="2.5"/>
    <path d="M 174 168 Q 182 162 190 168" fill="none" stroke="#431407" stroke-width="2.5"/>
    <polygon points="162,175 168,175 165,180" fill="#f43f5e"/>
    <path d="M 157 182 Q 165 188 173 182" fill="none" stroke="#431407" stroke-width="2"/>
    <!-- Tail spilling over rim like fluid -->
    <path d="M 225 152 Q 248 145 245 182 Q 242 200 250 208" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round"/>
    <!-- Glass outline -->
    <path d="M 100 130 C 100 208 130 236 165 236 C 200 236 230 208 230 130" fill="none" stroke="#e0f2fe" stroke-width="3.5"/>
    <ellipse cx="165" cy="130" rx="65" ry="10" fill="none" stroke="#e0f2fe" stroke-width="2.5"/>
    <text x="165" y="315" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="12" font-weight="bold">高脚杯态橘猫 (黏度 η = 极高)</text>
  </g>
  <!-- Center-Right: Fishbowl with Liquid White/Calico Cat -->
  <g>
    <circle cx="375" cy="222" r="68" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Top opening of fishbowl -->
    <ellipse cx="375" cy="158" rx="42" ry="9" fill="#0f172a" stroke="#bae6fd" stroke-width="3"/>
    <!-- Liquid cat filling bowl up to neck -->
    <circle cx="395" cy="235" r="18" fill="#fb923c" opacity="0.8"/>
    <circle cx="345" cy="250" r="14" fill="#334155" opacity="0.8"/>
    <!-- Cat ears & paws floating at top -->
    <polygon points="348,162 356,138 368,162" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="382,162 394,138 402,162" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
    <circle cx="364" cy="202" r="3.5" fill="#0f172a"/>
    <circle cx="388" cy="202" r="3.5" fill="#0f172a"/>
    <path d="M 370 212 Q 376 217 382 212" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="375" cy="222" r="68" fill="none" stroke="#bae6fd" stroke-width="3.5"/>
    <!-- Glass reflection -->
    <path d="M 322 195 A 55 55 0 0 0 328 255" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <text x="375" y="315" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="12" font-weight="bold">鱼缸态三花猫 (100% 贴合容器)</text>
  </g>
  <!-- Right: Physicist Marc-Antoine Fardin -->
  <g>
    <circle cx="545" cy="165" r="22" fill="#fed7aa"/>
    <path d="M 523 158 Q 545 132 567 158" fill="#451a03"/>
    <rect x="518" y="188" width="54" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="545" y1="188" x2="545" y2="293" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Speech bubble -->
    <rect x="462" y="65" width="155" height="52" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <polygon points="535,117 542,135 550,117" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="540" y="88" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="12" font-weight="bold">“只要给猫足够时间，</text>
    <text x="540" y="106" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="12" font-weight="bold">猫就是标准非牛顿流体！”</text>
  </g>
  <!-- Bottom Banner -->
  <rect x="20" y="328" width="600" height="40" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="320" y="353" text-anchor="middle" fill="#ffedd5" font-family="sans-serif" font-size="13" font-weight="bold">2017 物理学奖：猫咪流变学 (On the Rheology of Cats) —— 既是固体又是液体</text>
</svg>