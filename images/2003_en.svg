<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2003" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ramp2003" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2003)" rx="16"/>
  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#78350f"/>
  <text x="320" y="42" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="16" font-weight="bold">2003 Physics Prize: Forces Required to Drag Sheep over Surfaces</text>
  <!-- Lab Board -->
  <rect x="38" y="72" width="185" height="115" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="50" y="95" fill="#78350f" font-family="monospace" font-size="13" font-weight="bold">SHEEP DRAG LAB</text>
  <text x="50" y="116" fill="#dc2626" font-family="monospace" font-size="12">F = μ · m · g · cos(θ)</text>
  <text x="50" y="138" fill="#1e40af" font-family="sans-serif" font-size="12">▪ Wood Slats: μ = 0.42</text>
  <text x="50" y="158" fill="#15803d" font-family="sans-serif" font-size="12">▪ Sloped Batten: Easiest!</text>
  <text x="50" y="176" fill="#6b7280" font-family="sans-serif" font-size="11">Slope Grade = 1 : 10</text>
  <!-- Inclined Ramp Floor -->
  <polygon points="40,340 600,270 600,350 40,350" fill="url(#ramp2003)" stroke="#451a03" stroke-width="3"/>
  <line x1="200" y1="320" x2="200" y2="350" stroke="#fef3c7" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="390" y1="296" x2="390" y2="350" stroke="#fef3c7" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="115" y="342" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Wire Mesh</text>
  <text x="295" y="335" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Parallel Slats</text>
  <text x="495" y="325" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Cross Battens</text>
  <!-- Stubborn Fluffy Sheep -->
  <g transform="translate(150, 175)">
    <line x1="45" y1="95" x2="65" y2="145" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <line x1="70" y1="95" x2="90" y2="142" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <line x1="125" y1="90" x2="145" y2="135" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <line x1="145" y1="90" x2="165" y2="132" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <path d="M55,145 L40,138 M82,142 L68,134 M138,135 L123,128" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="60" cy="65" r="32" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <circle cx="95" cy="52" r="36" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <circle cx="135" cy="58" r="34" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <circle cx="80" cy="82" r="30" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <circle cx="120" cy="80" r="30" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <ellipse cx="168" cy="55" rx="24" ry="19" fill="#374151" transform="rotate(-10 168 55)"/>
    <circle cx="160" cy="36" r="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="172" cy="50" r="5" fill="#ffffff"/>
    <circle cx="174" cy="50" r="2.5" fill="#000000"/>
    <path d="M168,64 Q176,60 183,65" stroke="#fca5a5" stroke-width="2.5" fill="none"/>
    <rect x="35" y="-18" width="145" height="32" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="107" y="3" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="12" font-weight="bold">Baa! Not Budging! (55kg)</text>
  </g>
  <!-- Force Gauge / Spring Scale & Rope -->
  <line x1="332" y1="228" x2="388" y2="215" stroke="#b45309" stroke-width="4"/>
  <rect x="388" y="198" width="76" height="28" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
  <text x="426" y="217" text-anchor="middle" fill="#dc2626" font-family="monospace" font-size="13" font-weight="bold">248.5 N</text>
  <line x1="464" y1="212" x2="500" y2="205" stroke="#b45309" stroke-width="4"/>
  <!-- Force Vector Arrow -->
  <line x1="340" y1="175" x2="455" y2="155" stroke="#dc2626" stroke-width="4"/>
  <polygon points="455,148 472,153 457,163" fill="#dc2626"/>
  <text x="405" y="145" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">Pull Force F_pull</text>
  <!-- Researcher Pulling -->
  <g transform="translate(485, 115)">
    <line x1="35" y1="115" x2="15" y2="170" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
    <line x1="50" y1="115" x2="75" y2="162" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
    <path d="M20,55 L65,55 L75,120 L15,120 Z" fill="#ffffff" stroke="#475569" stroke-width="3" transform="rotate(14 45 85)"/>
    <line x1="25" y1="75" x2="-10" y2="90" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-12" cy="90" r="6" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <circle cx="52" cy="34" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="52" cy="18" rx="30" ry="7" fill="#78350f"/>
    <path d="M34,18 Q52,0 70,18" fill="#92400e"/>
    <circle cx="80" cy="28" r="3.5" fill="#38bdf8"/>
    <circle cx="86" cy="38" r="2.5" fill="#38bdf8"/>
  </g>
</svg>