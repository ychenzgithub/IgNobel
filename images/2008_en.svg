  <text x="350" y="309" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="10" font-weight="bold">GOAL OAT</text>
  <!-- Retracted Dead-end Branches -->
  <path d="M85,135 L85,310 L250,310" fill="none" stroke="#eab308" stroke-width="4" stroke-dasharray="5,5" opacity="0.45"/>
  <path d="M162,110 L215,110" fill="none" stroke="#eab308" stroke-width="4" stroke-dasharray="5,5" opacity="0.45"/>
  <!-- Active Golden Slime Mold Optimal Path! -->
  <path d="M85,115 L85,225 L162,225 L162,105 L350,105 L350,305" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M85,115 L85,225 L162,225 L162,105 L350,105 L350,305" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cute Slime Mold Character with Graduation Cap -->
  <g transform="translate(235, 82)">
    <circle cx="25" cy="22" r="18" fill="#eab308" stroke="#a16207" stroke-width="2.5"/>
