  </g>
  <!-- Right Info Panel -->
  <rect x="420" y="75" width="195" height="275" rx="12" fill="#ffffff" stroke="#7e22ce" stroke-width="3"/>
  <text x="517" y="105" text-anchor="middle" fill="#581c87" font-family="sans-serif" font-size="14" font-weight="bold">Slime Mold Intelligence</text>
  <text x="517" y="128" text-anchor="middle" fill="#6b21a8" font-family="monospace" font-size="11">Physarum polycephalum</text>
  <line x1="438" y1="140" x2="596" y2="140" stroke="#d8b4fe" stroke-width="2"/>
  <text x="436" y="168" fill="#1e293b" font-family="sans-serif" font-size="12">▪ Neurons: 0 (Zero!)</text>
  <text x="436" y="194" fill="#1e293b" font-family="sans-serif" font-size="12">▪ Body: Single-Celled Syncytium</text>
  <text x="436" y="220" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold">▪ Trick: Retracts Dead-End Tubes</text>
  <text x="436" y="244" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="bold">▪ Result: Finds Shortest Path!</text>
  <rect x="436" y="268" width="162" height="62" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="517" y="292" text-anchor="middle" fill="#581c87" font-family="sans-serif" font-size="11" font-weight="bold">"Who needs a brain to</text>
  <text x="517" y="314" text-anchor="middle" fill="#7e22ce" font-family="sans-serif" font-size="11" font-weight="bold">solve graph theory?"</text>
</svg>