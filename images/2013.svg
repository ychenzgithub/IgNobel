<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night2013" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="65%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="milkyway2013" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#night2013)" rx="16"/>

  <!-- Milky Way Band Across the Sky -->
  <path d="M-20,165 Q180,55 360,115 T660,75 L660,145 Q460,185 280,130 T-20,220 Z" fill="url(#milkyway2013)"/>
  <!-- Stars -->
  <circle cx="85" cy="95" r="2.5" fill="#ffffff"/>
  <circle cx="145" cy="120" r="3.5" fill="#fde047"/>
  <circle cx="220" cy="105" r="2" fill="#ffffff"/>
  <circle cx="290" cy="112" r="4" fill="#bae6fd"/>
  <circle cx="385" cy="128" r="3" fill="#fde047"/>
  <circle cx="465" cy="115" r="2.5" fill="#ffffff"/>
  <circle cx="535" cy="98" r="3.5" fill="#e9d5ff"/>
  <text x="480" y="90" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="bold">✨ 璀璨银河系 (The Milky Way) ✨</text>

  <!-- Title Banner -->
  <rect x="20" y="14" width="600" height="44" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" fill="#f3e8ff" font-family="sans-serif" font-size="18" font-weight="bold">2013 生物学与天文学联合奖：仰望银河系导航回家的屎壳郎</text>

  <!-- Desert Ground -->
  <path d="M0,305 Q160,285 320,305 T640,295 L640,380 L0,380 Z" fill="#78350f"/>

  <!-- Giant Dung Ball in Center -->
  <g transform="translate(215, 195)">
    <circle cx="95" cy="85" r="56" fill="#92400e" stroke="#451a03" stroke-width="3.5"/>
    <path d="M65,60 Q90,48 115,62 M58,95 Q95,112 128,92" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <text x="95" y="92" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="13" font-weight="bold">皇家珍藏粪球</text>

    <!-- Dung Beetle Standing Proudly on Top of the Dung Ball -->
    <ellipse cx="95" cy="18" rx="28" ry="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="122" cy="14" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Little Cardboard Cap (Experimental Sky-View Cap) -->
    <polygon points="112,2 142,-4 136,10 110,10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Beetle Eyes Looking Up at the Milky Way -->
    <circle cx="126" cy="10" r="4" fill="#ffffff"/>
    <circle cx="127" cy="8" r="2" fill="#000000"/>
    <!-- Starlight Navigation Beam -->
    <line x1="128" y1="4" x2="210" y2="-75" stroke="#fde047" stroke-width="2.5" stroke-dasharray="5,4"/>
    <!-- Straight Rolling Vector Arrow -->
    <line x1="160" y1="85" x2="285" y2="85" stroke="#4ade80" stroke-width="5"/>
    <polygon points="285,76 305,85 285,94" fill="#4ade80"/>
    <text x="230" y="70" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">笔直推球逃离情敌与强盗！</text>
  </g>

  <!-- Left Info Card -->
  <rect x="28" y="165" width="195" height="118" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="125" y="188" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">天象馆对照实验结果：</text>
  <text x="40" y="212" fill="#4ade80" font-family="sans-serif" font-size="12">▪ 星空/银河可见：21秒直线推走</text>
  <text x="40" y="236" fill="#f87171" font-family="sans-serif" font-size="12">▪ 戴遮光帽/阴天：原地转圈迷路</text>
  <text x="40" y="262" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="bold">结论：动物界首例银河系导航！</text>

  <!-- Quote on Right -->
  <rect x="425" y="150" width="190" height="72" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="520" y="176" text-anchor="middle" fill="#1e1b4b" font-family="sans-serif" font-size="12" font-weight="bold">“脚踏实地推粪球，</text>
  <text x="520" y="198" text-anchor="middle" fill="#6b21a8" font-family="sans-serif" font-size="12" font-weight="bold">仰望星空看银河！”</text>
</svg>