  <text x="320" y="92" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">SNAP! SNAP! SNAP! (Cascading Cracks!)</text>
  <!-- Elastic Flexural Wave Diagram Box -->
  <rect x="145" y="210" width="350" height="135" rx="12" fill="#ffffff" stroke="#be185d" stroke-width="3"/>
  <text x="320" y="236" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="14" font-weight="bold">Kirchhoff Elastic Flexural Wave Theory</text>
  <path d="M175,275 Q195,245 215,275 T255,275 T295,275 T335,275 T375,275 T415,275 T455,275" fill="none" stroke="#2563eb" stroke-width="3.5"/>
