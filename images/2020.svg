    <text x="43" y="78" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="10" font-weight="bold">¥100万</text>
    <text x="43" y="118" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">② 莫天祥</text>
    <text x="43" y="138" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="10">转包二道贩</text>
