<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2020" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" fill="url(#bg2020)"/>
  <text x="320" y="30" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="15" font-weight="bold">💼 广西南宁“五级层层转包”零伤亡雇凶管理学模型</text>
  <!-- 5-Step Waterfall Staircase of Subcontracting Hitmen -->
  <!-- Step 1: Xi Guang-An (200W) -->
  <g transform="translate(22, 52)">
    <rect x="0" y="95" width="86" height="155" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="43" cy="36" r="14" fill="#fed7aa"/>
    <rect x="28" y="25" width="30" height="7" rx="2" fill="#0f172a"/>
