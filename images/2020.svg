    <rect x="66" y="131" width="12" height="11" rx="2" fill="#ffffff"/>
    <rect x="94" y="131" width="12" height="11" rx="2" fill="#ffffff"/>
    <!-- Speech Bubble inside Cafe -->
    <rect x="12" y="45" width="148" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="86" y="63" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="10" font-weight="bold">“到手才10万，犯不上真杀，</text>
    <text x="86" y="79" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold">老兄配合演场假死戏呗？”</text>
    <text x="86" y="210" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">结局：无人伤亡 · 五人全判刑</text>
  </g>
  <!-- Bottom Banner -->
  <rect x="20" y="322" width="600" height="42" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="320" y="348" text-anchor="middle" fill="#fef9c3" font-family="sans-serif" font-size="13" font-weight="bold">2020 管理学奖：200万买凶杀人经四次转包缩水至10万，最终喝咖啡和解</text>
