    <text x="43" y="80" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="9" font-weight="bold">¥20万+</text>
    <text x="43" y="118" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">④ 杨广生</text>
