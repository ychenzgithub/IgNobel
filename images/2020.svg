    <rect x="22" y="12" width="128" height="24" rx="6" fill="#b45309"/>
    <text x="86" y="28" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">☕ 化敌为友咖啡馆</text>
    <!-- Hitman 5 on Left of Table -->
    <circle cx="42" cy="112" r="14" fill="#fed7aa"/>
    <rect x="24" y="128" width="36" height="42" rx="6" fill="#475569"/>
    <circle cx="52" cy="145" r="9" fill="#facc15"/>
