    <text x="43" y="118" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">① 奚广安</text>
    <text x="43" y="138" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="10">净赚100万</text>
  </g>
  <path d="M 110 115 L 128 130" stroke="#facc15" stroke-width="3"/>
  <!-- Step 2: Mo Tian-Xiang (100W) -->
  <g transform="translate(128, 78)">
    <rect x="0" y="95" width="86" height="129" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="43" cy="38" r="14" fill="#fed7aa"/>
    <rect x="28" y="27" width="30" height="7" rx="2" fill="#0f172a"/>
