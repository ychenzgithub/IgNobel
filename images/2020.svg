    <circle cx="43" cy="40" r="14" fill="#fed7aa"/>
    <rect x="28" y="29" width="30" height="7" rx="2" fill="#0f172a"/>
    <rect x="25" y="56" width="36" height="38" rx="6" fill="#1e293b"/>
