  <path d="M 428 194 L 448 205" stroke="#facc15" stroke-width="3"/>
  <!-- Step 5: Cafe Table where Hitman 5 (Ling Xian-Si) drinks coffee with the Target! -->
  <g transform="translate(446, 78)">
