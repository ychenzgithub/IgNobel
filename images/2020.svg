    <text x="43" y="79" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="9" font-weight="bold">¥27万+</text>
    <text x="43" y="118" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">③ 杨康生</text>
    <text x="43" y="138" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="10">转包三道贩</text>
  </g>
  <path d="M 322 168 L 340 183" stroke="#facc15" stroke-width="3"/>
  <!-- Step 4: Yang Guang-Sheng -->
  <g transform="translate(340, 130)">
    <rect x="0" y="95" width="86" height="77" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="43" cy="42" r="14" fill="#fed7aa"/>
    <rect x="28" y="31" width="30" height="7" rx="2" fill="#0f172a"/>
    <rect x="25" y="58" width="36" height="36" rx="6" fill="#1e293b"/>
